<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box{stroke-width:1.5;rx:8;}
      .lbl{font-size:13px;fill:#1a1a1a;}
      .lblw{font-size:13px;fill:#ffffff;font-weight:600;}
      .sub{font-size:11px;fill:#444;}
      .edge{stroke:#555;stroke-width:1.6;fill:none;marker-end:url(#arrow);}
      .etxt{font-size:11px;fill:#555;}
      .title{font-size:20px;font-weight:700;fill:#1a1a1a;}
      .cap{font-size:12px;fill:#666;}
    </style>
  </defs>

  <text x="480" y="34" text-anchor="middle" class="title">Mira — AI-Powered Project Intelligence Assistant</text>
  <text x="480" y="54" text-anchor="middle" class="cap">Multi-agent n8n workflow (ID: MwdbsS0NqgXApBUQ)</text>

  <!-- Chat Trigger -->
  <rect x="360" y="74" width="240" height="46" rx="23" fill="#e8f0fe" stroke="#4285f4" class="box"/>
  <text x="480" y="102" text-anchor="middle" class="lbl">Chat Trigger — user request</text>

  <!-- Google Drive -->
  <rect x="330" y="146" width="300" height="52" rx="8" fill="#fff4e5" stroke="#f9ab00" class="box"/>
  <text x="480" y="168" text-anchor="middle" class="lbl">Google Drive — Search files &amp; folders</text>
  <text x="480" y="186" text-anchor="middle" class="sub">folder-scoped read (input folder by ID)</text>

  <!-- Filter -->
  <rect x="360" y="224" width="240" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6" class="box"/>
  <text x="480" y="251" text-anchor="middle" class="lbl">Filter — all project files</text>

  <!-- Switch -->
  <rect x="360" y="294" width="240" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6" class="box"/>
  <text x="480" y="321" text-anchor="middle" class="lbl">Switch — route by file name</text>

  <!-- 4 files -->
  <rect x="70" y="364" width="185" height="40" rx="8" fill="#e6f4ea" stroke="#34a853" class="box"/>
  <text x="162" y="389" text-anchor="middle" class="sub">project_description.txt</text>
  <rect x="285" y="364" width="185" height="40" rx="8" fill="#e6f4ea" stroke="#34a853" class="box"/>
  <text x="377" y="389" text-anchor="middle" class="sub">sample_task_board.csv</text>
  <rect x="490" y="364" width="185" height="40" rx="8" fill="#e6f4ea" stroke="#34a853" class="box"/>
  <text x="582" y="389" text-anchor="middle" class="sub">project_risks.csv</text>
  <rect x="705" y="364" width="185" height="40" rx="8" fill="#e6f4ea" stroke="#34a853" class="box"/>
  <text x="797" y="389" text-anchor="middle" class="sub">project_timeline.csv</text>

  <!-- Task Board Counts -->
  <rect x="330" y="430" width="300" height="52" rx="8" fill="#fce8e6" stroke="#ea4335" class="box"/>
  <text x="480" y="452" text-anchor="middle" class="lbl">Task Board Counts (Code node)</text>
  <text x="480" y="470" text-anchor="middle" class="sub">deterministic status totals</text>

  <!-- Orchestrator -->
  <rect x="330" y="508" width="300" height="52" rx="8" fill="#e8eaf6" stroke="#3f51b5" class="box"/>
  <text x="480" y="530" text-anchor="middle" class="lbl">Orchestrator Agent</text>
  <text x="480" y="548" text-anchor="middle" class="sub">intent classification + routing (precedence rule)</text>

  <!-- 5 specialist agents -->
  <rect x="40" y="600" width="168" height="54" rx="8" fill="#673ab7" stroke="#512da8" class="box"/>
  <text x="124" y="624" text-anchor="middle" class="lblw">Planner</text>
  <text x="124" y="642" text-anchor="middle" class="lblw">Agent</text>

  <rect x="224" y="600" width="168" height="54" rx="8" fill="#673ab7" stroke="#512da8" class="box"/>
  <text x="308" y="624" text-anchor="middle" class="lblw">Risk Assessor</text>
  <text x="308" y="642" text-anchor="middle" class="lblw">Agent</text>

  <rect x="408" y="600" width="168" height="54" rx="8" fill="#673ab7" stroke="#512da8" class="box"/>
  <text x="492" y="624" text-anchor="middle" class="lblw">Status Reporter</text>
  <text x="492" y="642" text-anchor="middle" class="lblw">Agent</text>

  <rect x="592" y="600" width="168" height="54" rx="8" fill="#673ab7" stroke="#512da8" class="box"/>
  <text x="676" y="624" text-anchor="middle" class="lblw">Milestone Tracker</text>
  <text x="676" y="642" text-anchor="middle" class="lblw">Agent</text>

  <rect x="776" y="600" width="168" height="54" rx="8" fill="#673ab7" stroke="#512da8" class="box"/>
  <text x="860" y="620" text-anchor="middle" class="lblw">Stakeholder</text>
  <text x="860" y="636" text-anchor="middle" class="lblw">Update Gen.</text>
  <text x="860" y="652" text-anchor="middle" class="lblw">Agent</text>

  <!-- Chat Response -->
  <rect x="360" y="720" width="240" height="46" rx="23" fill="#e8f0fe" stroke="#4285f4" class="box"/>
  <text x="480" y="748" text-anchor="middle" class="lbl">Chat Response</text>

  <!-- Langfuse -->
  <rect x="360" y="800" width="240" height="46" rx="8" fill="#fef7e0" stroke="#f9ab00" class="box"/>
  <text x="480" y="822" text-anchor="middle" class="lbl">Langfuse</text>
  <text x="480" y="838" text-anchor="middle" class="sub">observability trace</text>

  <!-- Edges main spine -->
  <path class="edge" d="M480,120 L480,146"/>
  <path class="edge" d="M480,198 L480,224"/>
  <path class="edge" d="M480,268 L480,294"/>

  <!-- Switch to files -->
  <path class="edge" d="M400,338 C300,350 200,352 162,364"/>
  <path class="edge" d="M440,338 C410,350 390,354 377,364"/>
  <path class="edge" d="M520,338 C550,350 565,354 582,364"/>
  <path class="edge" d="M560,338 C680,350 760,352 797,364"/>

  <!-- files to Task Board Counts -->
  <path class="edge" d="M162,404 C260,420 340,428 380,430"/>
  <path class="edge" d="M377,404 C400,416 420,422 440,430"/>
  <path class="edge" d="M582,404 C560,416 540,422 520,430"/>
  <path class="edge" d="M797,404 C700,420 620,428 580,430"/>

  <path class="edge" d="M480,482 L480,508"/>

  <!-- Orchestrator to agents -->
  <path class="edge" d="M400,560 C260,578 170,588 124,600"/>
  <path class="edge" d="M430,560 C370,578 330,590 308,600"/>
  <path class="edge" d="M480,560 L492,600"/>
  <path class="edge" d="M530,560 C590,578 630,590 676,600"/>
  <path class="edge" d="M560,560 C700,578 790,588 860,600"/>

  <!-- agents to Chat Response -->
  <path class="edge" d="M124,654 C240,700 340,714 380,724"/>
  <path class="edge" d="M308,654 C360,690 400,710 430,720"/>
  <path class="edge" d="M492,654 L484,720"/>
  <path class="edge" d="M676,654 C620,690 580,710 540,720"/>
  <path class="edge" d="M860,654 C740,700 640,714 590,724"/>

  <path class="edge" d="M480,766 L480,800"/>
</svg>
